name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/TheAgency.sln

      - name: Build Solution
        run: dotnet build backend/TheAgency.sln --no-restore --configuration Release

      - name: Run Unit & Integration Test Suite
        run: dotnet test backend/TheAgency.sln --no-build --configuration Release --verbosity normal

      - name: Validate Phase 9 Production Security Audit
        run: dotnet test backend/tests/TheAgency.Tests.Unit/TheAgency.Tests.Unit.csproj --filter "Category=SecurityAudit" --no-build --configuration Release

  frontend-build-lint:
    name: Frontend Build & Lint (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Linter
        run: npm run lint
        working-directory: ./frontend

      - name: Build Frontend Application
        run: npm run build
        working-directory: ./frontend

  docker-build-check:
    name: Production Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Production Docker Image
        run: docker build -f backend/Dockerfile.production -t theagency-api:latest .

      - name: Build Frontend Production Docker Image
        run: docker build -f frontend/Dockerfile.production -t theagency-frontend:latest .
